<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mədinəyə özəl(: 🌷✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Sual Paneli */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 30px;
            font-size: 26px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            height: 50px;
            width: 280px;
            margin: 0 auto;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
        }

        /* Animasiya Ekranı */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #ffc3a0 0%, #ffafbd 100%);
            display: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Ortadakı Ürəyin Konteyneri */
        .heart-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Daimi Olaraq Öz Yerində Dövr Edən Yazılar */
        .floating-text {
            position: absolute;
            font-size: 13px;
            font-weight: 600;
            color: #ff2a5f;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            opacity: 0;
            top: var(--target-y);
            left: var(--target-x);
            /* Sonsuz dövr animasiyası: yaranır, titrəyir, itir və təkrar başlayır */
            animation: flowInAndOut var(--dur) ease-in-out infinite alternate;
            animation-delay: var(--delay);
        }

        /* Gizli və Sayı Azaldılmış Mira Yazısı */
        .secret-name {
            color: #ffb3bc !important; /* Fon rənginə çox yaxın çəhrayı */
            font-size: 11px !important;
            opacity: 0.28 !important; /* Görünməyi ciddi şəkildə azaldıldı */
            font-weight: bold;
            text-shadow: none !important;
        }

        /* Yazıların ürək daxilində daimi axın animasiyası */
        @keyframes flowInAndOut {
            0% {
                opacity: 0;
                transform: scale(0.7) rotate(0deg) translate(0, 0);
            }
            15% {
                opacity: var(--max-op);
            }
            50% {
                transform: scale(1.05) rotate(var(--rand-rot)) translate(var(--move-x), var(--move-y));
            }
            85% {
                opacity: var(--max-op);
            }
            100% {
                opacity: 0;
                transform: scale(0.8) rotate(calc(var(--rand-rot) * -1)) translate(calc(var(--move-x) * -1), calc(var(--move-y) * -1));
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizBox">
        <h2>Məni sevirsən?</h2>
        <div class="buttons">
            <button id="yesBtn">Hə</button>
            <button id="noBtn">Yox</button>
        </div>
    </div>

    <div class="celebration" id="loveScreen">
        <div class="heart-wrapper" id="heartContainer"></div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizBox = document.getElementById('quizBox');
        const loveScreen = document.getElementById('loveScreen');
        const heartContainer = document.getElementById('heartContainer');

        // "Yox" düyməsinin qaçması
        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 140) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - 90) - (window.innerHeight / 2 - 40);
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // "Hə" düyməsi basılanda
        yesBtn.addEventListener('click', () => {
            quizBox.style.display = 'none';
            loveScreen.style.display = 'block';
            buildPermanentHeart();
        });

        // Riyazi Ürək Formulu
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            
            return {
                x: 300 + x * 13,
                y: 260 - y * 13 
            };
        }

        function buildPermanentHeart() {
            const totalPoints = 110; // Ürəyin konturunu tam doldurmaq üçün optimal say
            const pool = ["Mədinə", "🌷", "I love you", "❤️"];
            
            // Cəmi 3 ədəd Mira üçün təsadüfi nöqtələr seçirik
            const miraIndices = [];
            while(miraIndices.length < 3) {
                let r = Math.floor(Math.random() * totalPoints);
                if(!miraIndices.includes(r)) miraIndices.push(r);
            }

            for (let i = 0; i < totalPoints; i++) {
                const angle = (i / totalPoints) * 2 * Math.PI;
                const targetPos = getHeartPoint(angle);

                const el = document.createElement('div');
                el.classList.add('floating-text');

                // Yazıların daxil edilməsi
                if (miraIndices.includes(i)) {
                    el.innerText = "Mira";
                    el.classList.add('secret-name');
                    el.style.setProperty('--max-op', '0.28'); // Mira üçün kiçik şəffaflıq
                } else {
                    el.innerText = pool[Math.floor(Math.random() * pool.length)];
                    el.style.setProperty('--max-op', (0.7 + Math.random() * 0.3)); // Digərləri üçün normal görünüş
                }

                // CSS dəyişənləri (Koordinatlar birbaşa ürək üzərindədir, kənara dağılmır)
                el.style.setProperty('--target-x', targetPos.x + 'px');
                el.style.setProperty('--target-y', targetPos.y + 'px');
                
                // Ürək daxili incə hərəkət və xaotik gecikmələr
                el.style.setProperty('--move-x', (Math.random() * 14 - 7) + 'px');
                el.style.setProperty('--move-y', (Math.random() * 14 - 7) + 'px');
                el.style.setProperty('--rand-rot', (Math.random() * 24 - 12) + 'deg');
                
                // Yazıların eyni anda yox, növbəli şəkildə yanıb-sönməsi (axın təsiri üçün)
                el.style.setProperty('--delay', (Math.random() * 5) + 's');
                el.style.setProperty('--dur', (4 + Math.random() * 3) + 's');

                heartContainer.appendChild(el);
            }
        }
    </script>
</body>
</html>
