<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sənin Üçün 🌷✨</title>
    <!-- Gözəl əl yazısı şrifti (Google Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Premium tünd neon qara gradient arxa fon */
            background: linear-gradient(-45deg, #0b090a, #161a1d, #0b090a, #200107);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Sual Paneli */
        .container {
            text-align: center;
            background: rgba(22, 26, 29, 0.75);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.15);
            z-index: 10;
            border: 1px solid rgba(255, 77, 109, 0.3);
            transition: all 0.5s ease;
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 30px;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            height: 50px;
            width: 280px;
            margin: 0 auto;
        }

        button {
            padding: 12px 35px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        #noBtn {
            background-color: #343a40;
            color: #e5e5e5;
            position: absolute;
            border: 1px solid #4f5d73;
        }

        /* Animasiya Ekranı */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Ortadakı Ürəyin Konteyneri */
        .heart-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Elementlərin Ümumi Stili */
        .floating-element {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Qara fonda bərq vuran Neon Əl Yazısı Stili */
        .floating-text-style {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            font-weight: 700;
            color: #ff4d6d;
            /* Neon parlama effekti */
            text-shadow: 0 0 8px rgba(255, 77, 109, 0.8), 0 0 20px rgba(255, 77, 109, 0.4);
            white-space: nowrap;
        }

        /* Real Gözəl SVG Şəkillərin Stili */
        .floating-svg-style {
            width: 35px;
            height: 35px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 77, 109, 0.6));
        }

        /* Sonsuz Dövr Edən Giriş və Çıxış Animasiyası */
        .animate-item {
            animation: gatherAndCycle var(--dur) cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: var(--delay);
        }

        @keyframes gatherAndCycle {
            0% {
                top: var(--start-y);
                left: var(--start-x);
                opacity: 0;
                transform: scale(0.3) rotate(var(--start-rot));
            }
            20% {
                opacity: 1;
            }
            /* Mərkəzdə birləşib ritmik yellənirlər */
            45%, 75% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: var(--max-op);
                transform: scale(1) rotate(var(--final-rot)) translate(var(--jitter-x), var(--jitter-y));
            }
            100% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: 0;
                transform: scale(0.5) rotate(calc(var(--final-rot) * 1.8));
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizBox">
        <h2>Məni sevirsən?</h2>
        <div class="buttons">
            <button id="yesBtn">Hə</button>
            <button id="noBtn">Yox</button>
        </div>
    </div>

    <div class="celebration" id="loveScreen">
        <div class="heart-wrapper" id="heartContainer"></div>
    </div>

    <!-- Musiqi elementi -->
    <audio id="bgMusic" loop preload="auto">
        <source src="ssstik.io_1784557325154.mp3" type="audio/mpeg">
    </audio>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizBox = document.getElementById('quizBox');
        const loveScreen = document.getElementById('loveScreen');
        const heartContainer = document.getElementById('heartContainer');
        const bgMusic = document.getElementById('bgMusic');

        // Heç bir internet linkindən asılı olmayan, birbaşa kodun daxilinə yerləşdirilmiş vektor tülpan və ürək (SVG Base64)
        const safeTulipSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 40c-6 0-12-5-12-14 0-10 12-22 12-22s12 12 12 22c0 9-6 14-12 14z' fill='%23ff3a5c'/><path d='M32 40c-3 0-7-2-8-8 3-1 6-4 7-8 1 4 4 7 7 8-1 6-5 8-8 8z' fill='%23ff5d7c'/><path d='M32 38v22' stroke='%234caf50' stroke-width='3' stroke-linecap='round'/><path d='M32 48c-4 1-7 4-8 8 3-1 7-1 8-8z' fill='%234caf50'/></svg>";
        const safeHeartSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 56.5L10.5 33.1C6.2 28.4 6.2 20.8 11 16.2c4.5-4.3 11.6-4 15.8.8L32 22.8l5.2-5.8c4.2-4.8 11.3-5.1 15.8-.8 4.8 4.6 4.8 12.2.5 16.9L32 56.5z' fill='%23e63946'/></svg>";

        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 140) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - 90) - (window.innerHeight / 2 - 40);
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        yesBtn.addEventListener('click', () => {
            quizBox.style.opacity = '0';
            setTimeout(() => {
                quizBox.style.display = 'none';
                loveScreen.style.display = 'block';
                startInfiniteHeartCycle();
            }, 400);
            
            bgMusic.play().catch(e => console.log("Musiqi xətası:", e));
        });

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return {
                x: 300 + x * 13,
                y: 270 - y * 13 
            };
        }

        function startInfiniteHeartCycle() {
            const totalPoints = 120;
            for (let i = 0; i < totalPoints; i++) {
                createCyclicElement(i, totalPoints);
            }
        }

        function createCyclicElement(index, totalPoints) {
            const angle = (index / totalPoints) * 2 * Math.PI;
            const targetPos = getHeartPoint(angle);

            const containerEl = document.createElement('div');
            containerEl.classList.add('floating-element', 'animate-item');

            const rand = Math.random();
            if (rand < 0.40) {
                containerEl.innerText = "Mədinə";
                containerEl.classList.add('floating-text-style');
            } else if (rand < 0.70) {
                containerEl.innerText = "Səni sevirəm";
                containerEl.classList.add('floating-text-style');
                containerEl.style.color = "#ff758f"; 
            } else if (rand < 0.90) {
                const img = document.createElement('img');
                img.src = safeTulipSvg;
                img.classList.add('floating-svg-style');
                containerEl.appendChild(img);
            } else {
                const img = document.createElement('img');
                img.src = safeHeartSvg;
                img.classList.add('floating-svg-style');
                img.style.width = "28px";
                containerEl.appendChild(img);
            }

            const side = Math.floor(Math.random() * 4);
            let startX, startY;
            const offset = 250;

            if (side === 0) { startX = Math.random() * window.innerWidth - (window.innerWidth / 2); startY = -offset; }
            else if (side === 1) { startX = window.innerWidth / 2 + offset; startY = Math.random() * window.innerHeight - (window.innerHeight / 2); }
            else if (side === 2) { startX = Math.random() * window.innerWidth - (window.innerWidth / 2); startY = window.innerHeight / 2 + offset; }
            else { startX = -window.innerWidth / 2 - offset; startY = Math.random() * window.innerHeight - (window.innerHeight / 2); }

            const duration = 6.5 + Math.random() * 3.5; 
            const delay = Math.random() * 4.5; 

            containerEl.style.setProperty('--start-x', startX + 'px');
            containerEl.style.setProperty('--start-y', startY + 'px');
            containerEl.style.setProperty('--target-x', targetPos.x + 'px');
            containerEl.style.setProperty('--target-y', targetPos.y + 'px');
            
            containerEl.style.setProperty('--start-rot', (Math.random() * 360) + 'deg');
            containerEl.style.setProperty('--final-rot', (Math.random() * 24 - 12) + 'deg');
            containerEl.style.setProperty('--jitter-x', (Math.random() * 12 - 6) + 'px');
            containerEl.style.setProperty('--jitter-y', (Math.random() * 12 - 6) + 'px');
            
            containerEl.style.setProperty('--max-op', (0.85 + Math.random() * 0.15));
            containerEl.style.setProperty('--dur', duration + 's');
            containerEl.style.setProperty('--delay', delay + 's');

            heartContainer.appendChild(containerEl);

            setTimeout(() => {
                containerEl.remove();
                createCyclicElement(index, totalPoints);
            }, (duration + delay) * 1000);
        }
    </script>
</body>
</html>
