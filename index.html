<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sənin Üçün 🌷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-950:#170a10;
    --wine-900:#230e17;
    --wine-800:#33111d;
    --rose-500:#e0335c;
    --rose-400:#f0577b;
    --blush-200:#f6d3d9;
    --gold-400:#d8b273;
    --cream:#f7ede8;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(224,51,92,0.10), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(216,178,115,0.08), transparent 50%),
      linear-gradient(160deg, var(--wine-950), var(--wine-900) 45%, var(--wine-800));
    font-family:'Poppins', sans-serif;
    overflow:hidden;
    position:relative;
    user-select:none;
  }

  /* ambient petals before the reveal */
  .petal-field{
    position:fixed; inset:0; pointer-events:none; z-index:1;
  }
  .petal{
    position:absolute;
    top:-40px;
    width:14px; height:18px;
    background:linear-gradient(160deg, var(--rose-400), var(--rose-500));
    border-radius:0 60% 0 60%;
    opacity:0.55;
    filter:drop-shadow(0 0 6px rgba(224,51,92,0.35));
    animation:fall linear infinite;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(320deg); }
  }

  /* ---------- question card ---------- */
  .container{
    text-align:center;
    background:rgba(35,14,23,0.55);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:52px 46px;
    border-radius:22px;
    box-shadow:0 25px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(216,178,115,0.18);
    z-index:10;
    border:1px solid rgba(216,178,115,0.25);
    transition:opacity .45s ease, transform .45s ease;
    max-width:90vw;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold-400);
    margin-bottom:14px;
    font-weight:500;
  }

  h2{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    color:var(--cream);
    margin-bottom:38px;
    font-size:clamp(26px, 4vw, 34px);
    line-height:1.3;
  }

  h2 span{
    color:var(--rose-400);
    font-style:normal;
  }

  .buttons{
    display:flex;
    justify-content:center;
    gap:22px;
    position:relative;
    height:54px;
    width:300px;
    margin:0 auto;
  }

  button{
    padding:13px 34px;
    font-family:'Poppins', sans-serif;
    font-size:16px;
    font-weight:500;
    letter-spacing:0.02em;
    border:none;
    border-radius:14px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  button:active{ transform:scale(0.96); }

  #yesBtn{
    background:linear-gradient(135deg, var(--rose-500), var(--rose-400));
    color:#fff;
    box-shadow:0 8px 24px rgba(224,51,92,0.4);
  }
  #yesBtn:hover{ box-shadow:0 10px 28px rgba(224,51,92,0.55); transform:translateY(-1px); }

  #noBtn{
    background:transparent;
    color:var(--blush-200);
    border:1px solid rgba(246,211,217,0.35);
    position:absolute;
  }

  /* ---------- celebration screen ---------- */
  .celebration{
    position:fixed;
    inset:0;
    display:none;
    z-index:5;
    overflow:hidden;
  }

  .center-label{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:6;
    opacity:0;
    animation:labelIn 1.2s ease forwards;
    animation-delay:0.6s;
    pointer-events:none;
  }
  @keyframes labelIn{ to{ opacity:1; } }

  .center-label .name{
    font-family:'Great Vibes', cursive;
    font-size:clamp(48px, 9vw, 84px);
    color:var(--rose-400);
    text-shadow:0 0 25px rgba(224,51,92,0.55);
    display:block;
  }
  .center-label .sub{
    font-family:'Playfair Display', serif;
    font-style:italic;
    color:var(--cream);
    font-size:clamp(15px, 2vw, 19px);
    letter-spacing:0.04em;
    opacity:0.9;
  }

  .heart-wrapper{
    position:absolute;
    top:50%; left:50%;
    width:600px; height:600px;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }

  .floating-element{
    position:absolute;
    pointer-events:none;
    opacity:0;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .floating-text-style{
    font-family:'Great Vibes', cursive;
    font-size:26px;
    color:var(--rose-400);
    text-shadow:0 0 10px rgba(224,51,92,0.7), 0 0 22px rgba(224,51,92,0.35);
    white-space:nowrap;
  }

  .floating-svg-style{
    width:32px; height:32px;
    object-fit:contain;
    filter:drop-shadow(0 0 8px rgba(224,51,92,0.55));
  }

  .animate-item{
    animation:gatherAndCycle var(--dur) cubic-bezier(0.25,1,0.5,1) forwards;
    animation-delay:var(--delay);
  }

  @keyframes gatherAndCycle{
    0%{ top:var(--start-y); left:var(--start-x); opacity:0; transform:scale(0.3) rotate(var(--start-rot)); }
    20%{ opacity:1; }
    45%,75%{ top:var(--target-y); left:var(--target-x); opacity:var(--max-op); transform:scale(1) rotate(var(--final-rot)) translate(var(--jitter-x), var(--jitter-y)); }
    100%{ top:var(--target-y); left:var(--target-x); opacity:0; transform:scale(0.5) rotate(calc(var(--final-rot) * 1.8)); }
  }

  .sound-toggle{
    position:fixed;
    bottom:22px; right:22px;
    z-index:20;
    width:42px; height:42px;
    border-radius:50%;
    background:rgba(35,14,23,0.6);
    border:1px solid rgba(216,178,115,0.3);
    color:var(--gold-400);
    font-size:17px;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(10px);
  }

  @media (prefers-reduced-motion: reduce){
    .petal, .animate-item{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="petal-field" id="petalField"></div>

  <div class="container" id="quizBox">
    <div class="eyebrow">Bir sual var</div>
    <h2>Məni sevirsən, <span>Mədinə</span>?</h2>
    <div class="buttons">
      <button id="yesBtn">Hə 💕</button>
      <button id="noBtn">Yox</button>
    </div>
  </div>

  <div class="celebration" id="loveScreen">
    <div class="center-label">
      <span class="name">Mədinə</span>
      <span class="sub">səni ürəkdən sevirəm</span>
    </div>
    <div class="heart-wrapper" id="heartContainer"></div>
  </div>

  <button class="sound-toggle" id="soundToggle" aria-label="Musiqini aç/bağla">🔊</button>

  <audio id="bgMusic" loop preload="auto">
    <source src="ssstik.io_1784560121150.mp3" type="audio/mpeg">
  </audio>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const quizBox = document.getElementById('quizBox');
  const loveScreen = document.getElementById('loveScreen');
  const heartContainer = document.getElementById('heartContainer');
  const bgMusic = document.getElementById('bgMusic');
  const soundToggle = document.getElementById('soundToggle');
  const petalField = document.getElementById('petalField');

  // ---------- ambient petals (before answering) ----------
  function spawnPetal(){
    const p = document.createElement('div');
    p.className = 'petal';
    const startX = Math.random() * window.innerWidth;
    const duration = 9 + Math.random() * 8;
    const drift = (Math.random() * 80 - 40);
    p.style.left = startX + 'px';
    p.style.animationDuration = duration + 's';
    p.style.setProperty('--drift', drift + 'px');
    p.style.transform = `translateX(${drift}px)`;
    petalField.appendChild(p);
    setTimeout(() => p.remove(), duration * 1000);
  }
  const petalInterval = setInterval(spawnPetal, 450);
  for (let i = 0; i < 10; i++) setTimeout(spawnPetal, i * 200);

  // ---------- playful "No" button ----------
  function moveNoButton(){
    const maxX = window.innerWidth / 2 - 90;
    const maxY = window.innerHeight / 2 - 60;
    const x = Math.random() * maxX * 2 - maxX;
    const y = Math.random() * maxY * 2 - maxY;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  }
  noBtn.addEventListener('mouseenter', moveNoButton);
  noBtn.addEventListener('click', moveNoButton);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); });

  // ---------- reveal ----------
  yesBtn.addEventListener('click', () => {
    clearInterval(petalInterval);
    quizBox.style.opacity = '0';
    quizBox.style.transform = 'scale(0.96)';
    setTimeout(() => {
      quizBox.style.display = 'none';
      loveScreen.style.display = 'block';
      soundToggle.style.display = 'flex';
      startInfiniteHeartCycle();
    }, 450);

    bgMusic.volume = 0.7;
    bgMusic.play().catch(() => {});
  });

  soundToggle.addEventListener('click', () => {
    if (bgMusic.paused) {
      bgMusic.play().catch(() => {});
      soundToggle.textContent = '🔊';
    } else {
      bgMusic.pause();
      soundToggle.textContent = '🔇';
    }
  });

  // ---------- heart formation ----------
  function getHeartPoint(t){
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    return { x: 300 + x * 13, y: 300 - y * 13 };
  }

  const safeTulipSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 40c-6 0-12-5-12-14 0-10 12-22 12-22s12 12 12 22c0 9-6 14-12 14z' fill='%23e0335c'/><path d='M32 40c-3 0-7-2-8-8 3-1 6-4 7-8 1 4 4 7 7 8-1 6-5 8-8 8z' fill='%23f0577b'/><path d='M32 38v22' stroke='%23d8b273' stroke-width='3' stroke-linecap='round'/><path d='M32 48c-4 1-7 4-8 8 3-1 7-1 8-8z' fill='%23d8b273'/></svg>";
  const safeHeartSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 56.5L10.5 33.1C6.2 28.4 6.2 20.8 11 16.2c4.5-4.3 11.6-4 15.8.8L32 22.8l5.2-5.8c4.2-4.8 11.3-5.1 15.8-.8 4.8 4.6 4.8 12.2.5 16.9L32 56.5z' fill='%23e0335c'/></svg>";

  function startInfiniteHeartCycle(){
    const totalPoints = 110;
    for (let i = 0; i < totalPoints; i++) createCyclicElement(i, totalPoints);
  }

  function createCyclicElement(index, totalPoints){
    const angle = (index / totalPoints) * 2 * Math.PI;
    const targetPos = getHeartPoint(angle);

    const el = document.createElement('div');
    el.classList.add('floating-element', 'animate-item');

    const rand = Math.random();
    if (rand < 0.38){
      el.innerText = "Mədinə";
      el.classList.add('floating-text-style');
    } else if (rand < 0.68){
      el.innerText = "Səni sevirəm";
      el.classList.add('floating-text-style');
      el.style.color = "#f0577b";
    } else if (rand < 0.9){
      const img = document.createElement('img');
      img.src = safeTulipSvg;
      img.classList.add('floating-svg-style');
      el.appendChild(img);
    } else {
      const img = document.createElement('img');
      img.src = safeHeartSvg;
      img.classList.add('floating-svg-style');
      img.style.width = "26px";
      el.appendChild(img);
    }

    const side = Math.floor(Math.random() * 4);
    let startX, startY;
    const offset = 250;
    if (side === 0){ startX = Math.random() * window.innerWidth - window.innerWidth/2; startY = -offset; }
    else if (side === 1){ startX = window.innerWidth/2 + offset; startY = Math.random() * window.innerHeight - window.innerHeight/2; }
    else if (side === 2){ startX = Math.random() * window.innerWidth - window.innerWidth/2; startY = window.innerHeight/2 + offset; }
    else { startX = -window.innerWidth/2 - offset; startY = Math.random() * window.innerHeight - window.innerHeight/2; }

    const duration = 6.5 + Math.random() * 3.5;
    const delay = Math.random() * 4.5;

    el.style.setProperty('--start-x', startX + 'px');
    el.style.setProperty('--start-y', startY + 'px');
    el.style.setProperty('--target-x', targetPos.x + 'px');
    el.style.setProperty('--target-y', targetPos.y + 'px');
    el.style.setProperty('--start-rot', (Math.random() * 360) + 'deg');
    el.style.setProperty('--final-rot', (Math.random() * 24 - 12) + 'deg');
    el.style.setProperty('--jitter-x', (Math.random() * 12 - 6) + 'px');
    el.style.setProperty('--jitter-y', (Math.random() * 12 - 6) + 'px');
    el.style.setProperty('--max-op', (0.85 + Math.random() * 0.15));
    el.style.setProperty('--dur', duration + 's');
    el.style.setProperty('--delay', delay + 's');

    heartContainer.appendChild(el);

    setTimeout(() => {
      el.remove();
      createCyclicElement(index, totalPoints);
    }, (duration + delay) * 1000);
  }
</script>
</body>
</html>
