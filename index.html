 <!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special for Madina ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #05050a;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Arxa fonda dərinlik effekti yaratmaq üçün zəif qradiyent */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 77, 109, 0.08) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
        }

        .scene {
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            animation: rotateScene 16s infinite linear;
        }

        .word-element {
            position: absolute;
            font-weight: 800;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
            transform-style: preserve-3d;
            backface-visibility: visible;
            user-select: none;
            transition: all 0.3s ease;
        }

        /* Mədinə adının zərif çəhrayı və parıltılı üslubu */
        .madina-style {
            color: #ffb3c6;
            font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(255, 179, 198, 0.6), 0 0 20px rgba(255, 179, 198, 0.3);
        }

        /* Mira adının daha diqqətçəkən, alovlu qırmızı üslubu */
        .mira-style {
            color: #ff4d6d;
            font-size: 1.3rem;
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.9), 0 0 30px rgba(255, 77, 109, 0.5);
            z-index: 10;
        }

        /* Ürəyin 3D fəzada professional şəkildə fırlanması */
        @keyframes rotateScene {
            0% {
                transform: rotateX(10deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(10deg) rotateY(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="scene" id="heart-scene"></div>

    <script>
        const scene = document.getElementById('heart-scene');
        const totalElements = 220; // Strukturun daha dolğun görünməsi üçün say artırıldı
        const scaleFactor = 18;    // Telefon ekranına tam uyğunlaşdırılmış miqyas

        // Mira adlarının ürəyin ön və görünən hissələrində strateji yerləşdirilməsi
        const miraIndices = [45, 110, 165]; 

        for (let i = 0; i < totalElements; i++) {
            const el = document.createElement('div');
            el.className = 'word-element';

            // Ad seçimi
            if (miraIndices.includes(i)) {
                el.innerText = 'Mira';
                el.classList.add('mira-style');
            } else {
                el.innerText = 'Mədinə';
                el.classList.add('madina-style');
            }

            // Riyazi Parametrik Ürək Düsturu (3D Math Heart Curve)
            const t = (i / totalElements) * 2 * Math.PI;
            
            // X və Y koordinatları (Klassik ürək forması)
            const x = 16 * Math.pow(Math.sin(t), 3) * scaleFactor;
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scaleFactor;
            
            // Z koordinatı (Ürəyə 3D həcm və dolğunluq vermək üçün qabarıqlıq)
            const z = Math.sin(t * 2) * 65; 

            // Professional Billboard Effekti:
            // Fırlanma zamanı adların tərs görünməməsi üçün riyazi bucaq korreksiyası
            const yRotation = -(t * 180 / Math.PI);

            // Elementin 3D fəzada yerləşdirilməsi
            el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${yRotation}deg)`;
            
            scene.appendChild(el);
        }
    </script>
</body>
</html>
