<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz v2 :)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Sual Paneli */
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 10;
            transition: all 0.5s ease;
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
            width: 250px;
            margin: 0 auto;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #778da9;
            color: white;
            position: absolute;
        }

        /* Animasiya Ekranı */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff0f3;
            display: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Arxa Plandakı Böyük Zərif Ürək */
        .background-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background-color: #ff4d6d;
            transform: translate(-50%, -50%) rotate(-45deg);
            animation: heartbeat 2s infinite ease-in-out;
            opacity: 0.15; /* Yazıların arxasında gizli qalması üçün */
            z-index: 1;
            pointer-events: none;
        }

        .background-heart::before,
        .background-heart::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }

        .background-heart::before { top: -150px; left: 0; }
        .background-heart::after { left: 150px; top: 0; }

        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.15); }
            100% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
        }

        /* Uçan adlar və ürəklər */
        .floating-text {
            position: absolute;
            font-size: 14px;
            font-weight: 600;
            color: #ff758f;
            pointer-events: none;
            z-index: 2; /* Ürəyin önündə olacaqlar */
            animation: elegantFloat var(--duration) linear infinite;
            text-shadow: 0 2px 5px rgba(255, 77, 109, 0.1);
        }

        /* Gizli Mira Yazısının Stili */
        .secret-name {
            color: #ffccd5 !important; /* Arxa fona çox yaxın xüsusi rəng */
            font-size: 11px !important;
            opacity: 0.3 !important; /* Çox diqqətlə baxanda seçilir */
            font-weight: bold;
            text-shadow: none !important;
        }

        /* Hər tərəfə dağılan axıcı animasiya */
        @keyframes elegantFloat {
            0% {
                top: var(--start-y);
                left: var(--start-x);
                opacity: 0;
                transform: scale(0.6) rotate(0deg);
            }
            10% {
                opacity: var(--max-opacity);
            }
            90% {
                opacity: var(--max-opacity);
            }
            100% {
                top: var(--end-y);
                left: var(--end-x);
                opacity: 0;
                transform: scale(1.1) rotate(var(--rot));
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizBox">
        <h2>Məni sevirsən?</h2>
        <div class="buttons">
            <button id="yesBtn">Hə</button>
            <button id="noBtn">Yox</button>
        </div>
    </div>

    <div class="celebration" id="loveScreen">
        <div class="background-heart"></div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizBox = document.getElementById('quizBox');
        const loveScreen = document.getElementById('loveScreen');

        // "Yox" düyməsinin qaçma funksiyası
        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 120) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - 80) - (window.innerHeight / 2 - 40);
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // "Hə" düyməsi basılanda
        yesBtn.addEventListener('click', () => {
            quizBox.style.display = 'none';
            loveScreen.style.display = 'block';
            startEffects();
        });

        function startEffects() {
            const totalElements = 140; // Ekrandakı ümumi element sıxlığı
            
            // 3 ədəd fərqli növbədə çıxacaq Mira təyin edirik
            const secretIndices = [];
            while(secretIndices.length < 3) {
                let r = Math.floor(Math.random() * totalElements);
                if(!secretIndices.includes(r)) secretIndices.push(r);
            }

            for (let i = 0; i < totalElements; i++) {
                setTimeout(() => {
                    createFloatingText(secretIndices.includes(i));
                }, i * 80); // Ekran tez dolsun deyə çıxma intervalı qısaldıldı
            }
        }

        function createFloatingText(isSecret) {
            const el = document.createElement('div');
            el.classList.add('floating-text');
            
            if (isSecret) {
                el.innerText = "Mira";
                el.classList.add('secret-name');
            } else {
                el.innerText = Math.random() > 0.35 ? "Mədinə" : "❤️";
            }

            // Ekranın HƏR TƏRƏFİNDƏN (Sol, Sağ, Aşağı) başlama məntiqi
            const side = Math.floor(Math.random() * 3); // 0: Aşağı, 1: Sol, 2: Sağ
            let startX, startY, endX, endY;

            if (side === 0) { // Aşağıdan çıxıb yuxarı dağılanlar
                startX = Math.random() * 100;
                startY = 105;
                endX = startX + (Math.random() * 40 - 20);
                endY = -10;
            } else if (side === 1) { // Soldan çıxıb sağa/yuxarı dağılanlar
                startX = -10;
                startY = Math.random() * 80 + 20;
                endX = Math.random() * 60 + 40;
                endY = startY - (Math.random() * 60 + 20);
            } else { // Sağdan çıxıb sola/yuxarı dağılanlar
                startX = 110;
                startY = Math.random() * 80 + 20;
                endX = Math.random() * 60;
                endY = startY - (Math.random() * 60 + 20);
            }

            const duration = 7 + Math.random() * 6; // 7-13 saniyə arası axıcı hərəkət
            const rotation = (Math.random() * 360 - 180) + 'deg';
            const maxOpacity = isSecret ? 0.3 : (0.6 + Math.random() * 0.4);

            el.style.setProperty('--start-x', startX + 'vw');
            el.style.setProperty('--start-y', startY + 'vh');
            el.style.setProperty('--end-x', endX + 'vw');
            el.style.setProperty('--end-y', endY + 'vh');
            el.style.setProperty('--duration', duration + 's');
            el.style.setProperty('--rot', rotation);
            el.style.setProperty('--max-opacity', maxOpacity);

            loveScreen.appendChild(el);

            // Element ekrandan itəndə onu silib yenisini fərqli koordinatla yaradırıq (Sonsuz dövr)
            setTimeout(() => {
                el.remove();
                createFloatingText(isSecret);
            }, duration * 1000);
        }
    </script>
</body>
</html>
