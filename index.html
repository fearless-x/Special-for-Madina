<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz :)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Sual Paneli */
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 10;
            transition: all 0.5s ease;
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
            width: 250px;
            margin: 0 auto;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #778da9;
            color: white;
            position: absolute;
        }

        /* Animasiya Ekranı */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff0f3;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Mərkəzdəki Böyük Ürək */
        .main-heart {
            position: relative;
            width: 150px;
            height: 150px;
            background-color: #ff4d6d;
            transform: rotate(-45deg);
            animation: heartbeat 1.2s infinite;
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.5);
        }

        .main-heart::before,
        .main-heart::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }

        .main-heart::before { top: -75px; left: 0; }
        .main-heart::after { left: 75px; top: 0; }

        @keyframes heartbeat {
            0% { transform: rotate(-45deg) scale(1); }
            20% { transform: rotate(-45deg) scale(1.1); }
            40% { transform: rotate(-45deg) scale(1); }
            60% { transform: rotate(-45deg) scale(1.15); }
            100% { transform: rotate(-45deg) scale(1); }
        }

        /* Uçan adlar və ürəklər */
        .floating-text {
            position: absolute;
            font-size: 13px; /* Yazılar çox böyük olmasın */
            font-weight: 500;
            color: #ff758f;
            pointer-events: none;
            animation: floatUp var(--duration) linear infinite;
            opacity: 0.8;
        }

        /* Gizli Mira Yazısının Stili */
        .secret-name {
            color: #ffccd5 !important; /* Arxa fona çox yaxın rəng */
            font-size: 11px !important; /* Daha kiçik */
            opacity: 0.25 !important; /* Çox şəffaf, diqqətlə baxanda görünür */
            font-weight: bold;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) translateX(0) rotate(0deg);
            }
            100% {
                transform: translateY(-10vh) translateX(var(--drift)) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizBox">
        <h2>Məni sevirsən?</h2>
        <div class="buttons">
            <button id="yesBtn">Hə</button>
            <button id="noBtn">Yox</button>
        </div>
    </div>

    <div class="celebration" id="loveScreen">
        <div class="main-heart"></div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizBox = document.getElementById('quizBox');
        const loveScreen = document.getElementById('loveScreen');

        // "Yox" düyməsinin qaçma funksiyası
        function moveNoButton() {
            // Ekranın ölçülərinə uyğun təsadüfi koordinatlar (kənarlardan bir az məsafə saxlayaraq)
            const x = Math.random() * (window.innerWidth - 120) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - 80) - (window.innerHeight / 2 - 40);
            
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Həm klikləyəndə, həm də siçan üzərinə gələndə qaçsın
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // "Hə" düyməsi basılanda
        yesBtn.addEventListener('click', () => {
            quizBox.style.display = 'none';
            loveScreen.style.display = 'flex';
            startEffects();
        });

        function startEffects() {
            const totalElements = 120; // Ekranda eyni anda olacaq ad sayı
            const secretIndex = Math.floor(Math.random() * totalElements); // Mira-nın gizlənəcəyi təsadüfi növbə

            for (let i = 0; i < totalElements; i++) {
                setTimeout(() => {
                    createFloatingText(i === secretIndex);
                }, i * 150); // Adların fərqli vaxtlarda çıxması üçün gecikmə
            }
        }

        function createFloatingText(isSecret) {
            const el = document.createElement('div');
            el.classList.add('floating-text');
            
            if (isSecret) {
                el.innerText = "Mira";
                el.classList.add('secret-name');
            } else {
                // Təsadüfi olaraq ya "Mədinə" ya da kiçik ürək simvolu çıxsın
                el.innerText = Math.random() > 0.3 ? "Mədinə" : "❤️";
            }

            // Təsadüfi mövqe və sürət parametrləri
            const startX = Math.random() * 100; // Ekranın eni boyunca % ilə
            const duration = 6 + Math.random() * 6; // 6-12 saniyə arası qalxma sürəti
            const drift = (Math.random() * 200 - 100) + 'px'; // Yuxarı qalxarkən sağa-sola meyllənmə

            el.style.left = startX + 'vw';
            el.style.setProperty('--duration', duration + 's');
            el.style.setProperty('--drift', drift);

            loveScreen.appendChild(el);

            // Animasiya bitəndə elementi silib yenisini yaradırıq ki, sonsuz davam etsin
            setTimeout(() => {
                el.remove();
                createFloatingText(isSecret); // Əgər silinən Miradırsa, yenidən Mira yaransın
            }, duration * 1000);
        }
    </script>
</body>
</html>
