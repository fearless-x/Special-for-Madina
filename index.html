<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz v3 🌷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* İlk sual ekranı üçün daha canlı gradient fon */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Sual Paneli */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px); /* Müasir şüşə effekti */
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 30px;
            font-size: 26px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            height: 50px;
            width: 280px;
            margin: 0 auto;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
        }

        /* Animasiya Ekranı - Daha Rəngli və Maraqlı Gradient */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #ffc3a0 0%, #ffafbd 100%);
            display: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Arxa Plandakı Böyük Zərif Ürək */
        .background-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 350px;
            height: 350px;
            background-color: #ff4d6d;
            transform: translate(-50%, -50%) rotate(-45deg);
            animation: heartbeat 2.5s infinite ease-in-out;
            opacity: 0.12; /* Yazıların və tülpanların tam arxasında qalsın */
            z-index: 1;
            pointer-events: none;
        }

        .background-heart::before,
        .background-heart::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }

        .background-heart::before { top: -175px; left: 0; }
        .background-heart::after { left: 175px; top: 0; }

        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
        }

        /* Uçan adlar, ürəklər və tülpanlar */
        .floating-text {
            position: absolute;
            font-size: 14px;
            font-weight: 600;
            color: #ff3366;
            pointer-events: none;
            z-index: 2;
            animation: elegantFloat var(--duration) linear infinite;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.6);
        }

        /* Gizli Mira Yazısının Stili (Fon rənginə uyğunlaşdırıldı ki, gizli qalsın) */
        .secret-name {
            color: #ffb3bc !important; /* Bu fonda çətin seçilən xüsusi çəhrayı tonu */
            font-size: 11px !important;
            opacity: 0.35 !important;
            font-weight: bold;
            text-shadow: none !important;
        }

        /* Hər tərəfə dağılan axıcı hərəkət animasiyası */
        @keyframes elegantFloat {
            0% {
                top: var(--start-y);
                left: var(--start-x);
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }
            15% {
                opacity: var(--max-opacity);
            }
            85% {
                opacity: var(--max-opacity);
            }
            100% {
                top: var(--end-y);
                left: var(--end-x);
                opacity: 0;
                transform: scale(1.2) rotate(var(--rot));
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizBox">
        <h2>Məni sevirsən?</h2>
        <div class="buttons">
            <button id="yesBtn">Hə</button>
            <button id="noBtn">Yox</button>
        </div>
    </div>

    <div class="celebration" id="loveScreen">
        <div class="background-heart"></div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizBox = document.getElementById('quizBox');
        const loveScreen = document.getElementById('loveScreen');

        // "Yox" düyməsinin qaçma mexanizmi
        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 140) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - 90) - (window.innerHeight / 2 - 40);
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // "Hə" düyməsi basılanda fona keçid
        yesBtn.addEventListener('click', () => {
            quizBox.style.display = 'none';
            loveScreen.style.display = 'block';
            startEffects();
        });

        function startEffects() {
            const totalElements = 150; // Element sıxlığı artırıldı
            
            // Ekranda eyni anda hərəkət edəcək 3 ədəd gizli "Mira" növbəsi
            const secretIndices = [];
            while(secretIndices.length < 3) {
                let r = Math.floor(Math.random() * totalElements);
                if(!secretIndices.includes(r)) secretIndices.push(r);
            }

            for (let i = 0; i < totalElements; i++) {
                setTimeout(() => {
                    createFloatingText(secretIndices.includes(i));
                }, i * 70); 
            }
        }

        function createFloatingText(isSecret) {
            const el = document.createElement('div');
            el.classList.add('floating-text');
            
            if (isSecret) {
                el.innerText = "Mira";
                el.classList.add('secret-name');
            } else {
                // Ehtimal paylanması: %45 Mədinə, %35 Tülpan (🌷), %20 Ürək (❤️)
                const rand = Math.random();
                if (rand < 0.45) {
                    el.innerText = "Mədinə";
                } else if (rand < 0.80) {
                    el.innerText = "🌷";
                    el.style.fontSize = "16px"; // Tülpanlar bir az daha şirin görünsün
                } else {
                    el.innerText = "❤️";
                }
            }

            // Ekranın hər tərəfindən çıxma trayektoriyası
            const side = Math.floor(Math.random() * 3); // 0: Aşağı, 1: Sol, 2: Sağ
            let startX, startY, endX, endY;

            if (side === 0) {
                startX = Math.random() * 100;
                startY = 105;
                endX = startX + (Math.random() * 40 - 20);
                endY = -10;
            } else if (side === 1) {
                startX = -10;
                startY = Math.random() * 80 + 20;
                endX = Math.random() * 60 + 40;
                endY = startY - (Math.random() * 60 + 20);
            } else {
                startX = 110;
                startY = Math.random() * 80 + 20;
                endX = Math.random() * 60;
                endY = startY - (Math.random() * 60 + 20);
            }

            const duration = 6 + Math.random() * 6; // 6-12 saniyəlik axıcı keçid
            const rotation = (Math.random() * 360 - 180) + 'deg';
            const maxOpacity = isSecret ? 0.35 : (0.7 + Math.random() * 0.3);

            el.style.setProperty('--start-x', startX + 'vw');
            el.style.setProperty('--start-y', startY + 'vh');
            el.style.setProperty('--end-x', endX + 'vw');
            el.style.setProperty('--end-y', endY + 'vh');
            el.style.setProperty('--duration', duration + 's');
            el.style.setProperty('--rot', rotation);
            el.style.setProperty('--max-opacity', maxOpacity);

            loveScreen.appendChild(el);

            // Sonsuz döngü üçün köhnəni silib yenisini fərqli trayektoriya ilə başladırıq
            setTimeout(() => {
                el.remove();
                createFloatingText(isSecret);
            }, duration * 1000);
        }
    </script>
</body>
</html>
