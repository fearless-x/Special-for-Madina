<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz v5 🌷✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Sual Paneli */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 30px;
            font-size: 26px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            height: 50px;
            width: 280px;
            margin: 0 auto;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
        }

        /* Animasiya Ekranı */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #ffc3a0 0%, #ffafbd 100%);
            display: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Ortadakı Ürəyin Konteyneri */
        .heart-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Uçan və birləşən yazılar */
        .floating-text {
            position: absolute;
            font-size: 13px;
            font-weight: 600;
            color: #ff2a5f;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            /* İlk mövqe olaraq ekranın kənarlarından başlayır */
            top: var(--start-y);
            left: var(--start-x);
            opacity: 0;
            /* Ortaya gəlmə və sonra daimi titrəmə animasiyası (Donma olmaması üçün tək bədəndə) */
            animation: gatherIn 3s ease-out forwards, heartFloat 3s ease-in-out infinite alternate;
            animation-delay: 0s, 3s; 
        }

        /* Mira Yazısının Stili (Bir az fərqli və görünən çəhrayı) */
        .secret-name {
            color: #e63946 !important;
            font-size: 12px !important;
            opacity: 0.65 !important; /* Rahat fərq edilsin deyə artırıldı */
            font-weight: bold;
        }

        /* Kənarlardan mərkəzə (ürək koordinatına) yığılma animasiyası */
        @keyframes gatherIn {
            0% {
                top: var(--start-y);
                left: var(--start-x);
                opacity: 0;
                transform: scale(0.5);
            }
            30% {
                opacity: 1;
            }
            100% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Ürək yarandıqdan sonra yazıların daimi ritmik hərəkəti */
        @keyframes heartFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(var(--rand-rot));
            }
            50% {
                transform: translate(var(--move-x), var(--move-y)) scale(1.05);
            }
            100% {
                transform: translate(calc(var(--move-x) * -1), calc(var(--move-y) * -1)) scale(0.95);
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizBox">
        <h2>Məni sevirsən?</h2>
        <div class="buttons">
            <button id="yesBtn">Hə</button>
            <button id="noBtn">Yox</button>
        </div>
    </div>

    <div class="celebration" id="loveScreen">
        <div class="heart-wrapper" id="heartContainer"></div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizBox = document.getElementById('quizBox');
        const loveScreen = document.getElementById('loveScreen');
        const heartContainer = document.getElementById('heartContainer');

        // "Yox" qaçış mexanizmi
        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 140) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - 90) - (window.innerHeight / 2 - 40);
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // "Hə" basılanda
        yesBtn.addEventListener('click', () => {
            quizBox.style.display = 'none';
            loveScreen.style.display = 'block';
            buildTextHeart();
        });

        // Riyazi olaraq Ürək Forması (Parametrik Ürək Düsturu)
        function getHeartPoint(t) {
            // t: 0-dan 2*PI-yə qədər dəyişir
            // Ölçünü tənzimləmək üçün x-i 16, y-i 13 ilə vurub genişləndiririk
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            
            // Konteyner mərkəzinə (300, 250) nisbətdə yerləşdirmə
            return {
                x: 300 + x * 12,
                y: 260 - y * 12  // Ekran koordinatında Y aşağı doğru artdığı üçün çıxırıq
            };
        }

        function buildTextHeart() {
            const totalPoints = 90; // Donma olmasın deyə optimal yazı sayı
            const pool = ["Mədinə", "🌷", "I love you", "❤️"];
            
            // 10 ədəd Mira üçün təsadüfi indekslər seçirik
            const miraIndices = [];
            while(miraIndices.length < 10) {
                let r = Math.floor(Math.random() * totalPoints);
                if(!miraIndices.includes(r)) miraIndices.push(r);
            }

            for (let i = 0; i < totalPoints; i++) {
                const angle = (i / totalPoints) * 2 * Math.PI;
                const targetPos = getHeartPoint(angle);

                const el = document.createElement('div');
                el.classList.add('floating-text');

                // Mətn təyini
                if (miraIndices.includes(i)) {
                    el.innerText = "Mira";
                    el.classList.add('secret-name');
                } else {
                    el.innerText = pool[Math.floor(Math.random() * pool.length)];
                }

                // Ekranın hər tərəfindən (kənarlardan) random başlama mövqeyi
                let startX, startY;
                if (Math.random() > 0.5) {
                    startX = Math.random() > 0.5 ? "-150px" : (window.innerWidth + 150) + "px";
                    startY = Math.random() * window.innerHeight + "px";
                } else {
                    startX = Math.random() * window.innerWidth + "px";
                    startY = Math.random() > 0.5 ? "-150px" : (window.innerHeight + 150) + "px";
                }

                // CSS dəyişənlərini ötürürük
                el.style.setProperty('--start-x', startX);
                el.style.setProperty('--start-y', startY);
                el.style.setProperty('--target-x', targetPos.x + 'px');
                el.style.setProperty('--target-y', targetPos.y + 'px');
                
                // Ürək daxilindəki fərdi titrəmə hərəkətləri üçün random limitlər
                el.style.setProperty('--move-x', (Math.random() * 16 - 8) + 'px');
                el.style.setProperty('--move-y', (Math.random() * 16 - 8) + 'px');
                el.style.setProperty('--rand-rot', (Math.random() * 20 - 10) + 'deg');
                
                // İncə xaotik görünüş üçün animasiya müddətini bir az fərqləndiririk
                el.style.animationDuration = `3s, ${2 + Math.random() * 2}s`;

                heartContainer.appendChild(el);
            }
        }
    </script>
</body>
</html>
