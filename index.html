<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuz Ürək Dövrü 🌷✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Sual Paneli */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 30px;
            font-size: 26px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            height: 50px;
            width: 280px;
            margin: 0 auto;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
        }

        /* Animasiya Ekranı */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #ffc3a0 0%, #ffafbd 100%);
            display: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Ortadakı Ürəyin Konteyneri */
        .heart-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Uçan, Birləşən və Dağılan Yazılar */
        .floating-text {
            position: absolute;
            font-size: 13px;
            font-weight: 600;
            color: #ff2a5f;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            opacity: 0;
            /* Tək bir ana animasiya ilə gəlmə, döyünmə və dağılma mərhələləri */
            animation: heartCycle 8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 10 Ədəd Görünən Mira Yazısı */
        .secret-name {
            color: #e63946 !important;
            font-size: 13px !important;
            opacity: 0.75 !important; 
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8) !important;
        }

        /* Sonsuz Dövrün Animasiya Məntiqi (Cəmi 8 saniyə çəkir) */
        @keyframes heartCycle {
            /* 0% - 35%: Hər tərəfdən gəlib tam ürək formasına yığılırlar */
            0% {
                top: var(--start-y);
                left: var(--start-x);
                opacity: 0;
                transform: scale(0.3) rotate(0deg);
            }
            30% {
                opacity: 1;
            }
            35% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: 1;
                transform: scale(1) rotate(var(--rand-rot));
            }
            /* 35% - 70%: Ortada ürək formasında qalıb zərifcə döyünürlər/titrəyirlər */
            50% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: 1;
                transform: translate(var(--move-x), var(--move-y)) scale(1.08) rotate(var(--rand-rot));
            }
            65% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: 1;
                transform: translate(0, 0) scale(0.95) rotate(var(--rand-rot));
            }
            /* 70% - 100%: Ürək forması dağılır, yazılar fərqli tərəflərə uçaraq yox olur */
            70% {
                opacity: 1;
            }
            100% {
                top: var(--end-y);
                left: var(--end-x);
                opacity: 0;
                transform: scale(1.3) rotate(calc(var(--rand-rot) * 3));
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizBox">
        <h2>Məni sevirsən?</h2>
        <div class="buttons">
            <button id="yesBtn">Hə</button>
            <button id="noBtn">Yox</button>
        </div>
    </div>

    <div class="celebration" id="loveScreen">
        <div class="heart-wrapper" id="heartContainer"></div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizBox = document.getElementById('quizBox');
        const loveScreen = document.getElementById('loveScreen');
        const heartContainer = document.getElementById('heartContainer');

        // "Yox" düyməsinin qaçması
        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 140) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - 90) - (window.innerHeight / 2 - 40);
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // "Hə" düyməsi basılanda sonsuz dövrü başladırıq
        yesBtn.addEventListener('click', () => {
            quizBox.style.display = 'none';
            loveScreen.style.display = 'block';
            
            // İlk ürək dalğası dərhal başlayır
            triggerHeartWave();
            
            // Hər 7.5 saniyədən bir yeni bir ürək dalğası yaranır (Köhnələr itənə yaxın yenisi gəlir)
            setInterval(triggerHeartWave, 7500);
        });

        // Riyazi Mükəmməl Ürək Formulu
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            
            // 600x600 ölçülü konteynerin tam mərkəzi nöqtələri
            return {
                x: 300 + x * 13,
                y: 260 - y * 13 
            };
        }

        function triggerHeartWave() {
            const totalPoints = 100; // Tam bir ürək forması üçün ideal say
            const pool = ["Mədinə", "🌷", "I love you", "❤️"];
            
            // Hər dalğada mütləq 10 dənə Mira olması üçün indekslərin seçilməsi
            const miraIndices = [];
            while(miraIndices.length < 10) {
                let r = Math.floor(Math.random() * totalPoints);
                if(!miraIndices.includes(r)) miraIndices.push(r);
            }

            // Bu dalğaya aid elementləri yığmaq üçün müvəqqəti massiv
            const currentWaveElements = [];

            for (let i = 0; i < totalPoints; i++) {
                const angle = (i / totalPoints) * 2 * Math.PI;
                const targetPos = getHeartPoint(angle);

                const el = document.createElement('div');
                el.classList.add('floating-text');

                // Adların təyini
                if (miraIndices.includes(i)) {
                    el.innerText = "Mira";
                    el.classList.add('secret-name');
                } else {
                    el.innerText = pool[Math.floor(Math.random() * pool.length)];
                }

                // 1. BAŞLANĞIC: Ekranın kənarlarından gəlmə koordinatları
                let startX, startY;
                if (Math.random() > 0.5) {
                    startX = Math.random() > 0.5 ? "-150px" : (window.innerWidth + 150) + "px";
                    startY = Math.random() * window.innerHeight + "px";
                } else {
                    startX = Math.random() * window.innerWidth + "px";
                    startY = Math.random() > 0.5 ? "-150px" : (window.innerHeight + 150) + "px";
                }

                // 3. SON: Ürək dağılandan sonra uçub gedəcəkləri fərqli random istiqamətlər
                const endX = (Math.random() * window.innerWidth * 1.5 - window.innerWidth * 0.25) + "px";
                const endY = (Math.random() * window.innerHeight * 1.5 - window.innerHeight * 0.25) + "px";

                // CSS xüsusiyyətlərinin elementə vurulması
                el.style.setProperty('--start-x', startX);
                el.style.setProperty('--start-y', startY);
                el.style.setProperty('--target-x', targetPos.x + 'px');
                el.style.setProperty('--target-y', targetPos.y + 'px');
                el.style.setProperty('--end-x', endX);
                el.style.setProperty('--end-y', endY);
                
                // Ürək daxilindəki fərdi ritmik titrəmələr üçün dinamik ölçülər
                el.style.setProperty('--move-x', (Math.random() * 20 - 10) + 'px');
                el.style.setProperty('--move-y', (Math.random() * 20 - 10) + 'px');
                el.style.setProperty('--rand-rot', (Math.random() * 30 - 15) + 'deg');
                
                // Elementlərin tam eyni anda yox, xəfif fərqlərlə yığılması üçün kiçik gecikmə effekti
                el.style.animationDelay = (Math.random() * 0.4) + "s";

                heartContainer.appendChild(el);
                currentWaveElements.push(el);
            }

            // Animasiya tam bitəndə (8 saniyə sonra) bu dalğanın bütün elementlərini DOM-dan silirik.
            // Bu, brauzerin şişməsini və donmasını tamamilə əngəlləyir.
            setTimeout(() => {
                currentWaveElements.forEach(el => el.remove());
            }, 8500);
        }
    </script>
</body>
</html>
