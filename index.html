<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sənin Üçün 🌷✨</title>
    <!-- Gözəl və estetik əl yazısı şrifti (Google Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffafbd, #ffc3a0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Sual Paneli */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.25);
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 30px;
            font-size: 26px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            height: 50px;
            width: 280px;
            margin: 0 auto;
        }

        button {
            padding: 12px 35px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
        }

        /* Animasiya Ekranı */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Ortadakı Ürəyin Konteyneri */
        .heart-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Elementlərin Ümumi Stili */
        .floating-element {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Xüsusi Gözəl Yazı Şrifti */
        .floating-text-style {
            font-family: 'Caveat', cursive;
            font-size: 24px; /* Şrift dəyişdiyi üçün ölçüsü böyüdüldü, çox gözəl qalın görünür */
            font-weight: 700;
            color: #d90429;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            white-space: nowrap;
        }

        /* Real Şəkillərin Stili */
        .floating-img-style {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.15));
        }

        /* Sonsuz Dövr Edən Giriş və Çıxış Animasiyası */
        .animate-item {
            animation: gatherAndCycle var(--dur) cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: var(--delay);
        }

        @keyframes gatherAndCycle {
            0% {
                top: var(--start-y);
                left: var(--start-x);
                opacity: 0;
                transform: scale(0.3) rotate(var(--start-rot));
            }
            20% {
                opacity: 1;
            }
            /* Mərkəzdə birləşib ürəyi yaradırlar və bir az rəqs edirlər */
            45%, 75% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: var(--max-op);
                transform: scale(1) rotate(var(--final-rot)) translate(var(--jitter-x), var(--jitter-y));
            }
            /* Yox olurlar ki, arxadan gələn yeniləri ilə əvəz olunsunlar */
            100% {
                top: var(--target-y);
                left: var(--target-x);
                opacity: 0;
                transform: scale(0.7) rotate(calc(var(--final-rot) * 1.5));
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizBox">
        <h2>Məni sevirsən?</h2>
        <div class="buttons">
            <button id="yesBtn">Hə</button>
            <button id="noBtn">Yox</button>
        </div>
    </div>

    <div class="celebration" id="loveScreen">
        <div class="heart-wrapper" id="heartContainer"></div>
    </div>

    <!-- Musiqi elementi -->
    <audio id="bgMusic" loop preload="auto">
        <source src="ssstik.io_1784557325154.mp3" type="audio/mpeg">
    </audio>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizBox = document.getElementById('quizBox');
        const loveScreen = document.getElementById('loveScreen');
        const heartContainer = document.getElementById('heartContainer');
        const bgMusic = document.getElementById('bgMusic');

        // Real Şəkillərin Linkləri (Şəffaf PNG formatında premium vizuallar)
        const realTulipImg = "https://i.imgur.com/vHq8S7g.png"; // Real Qırmızı/Çəhrayı Tülpan
        const realHeartImg = "https://i.imgur.com/S8p3bY6.png"; // Real Parlaq Ürək

        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 140) - (window.innerWidth / 2 - 100);
            const y = Math.random() * (window.innerHeight - 90) - (window.innerHeight / 2 - 40);
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        yesBtn.addEventListener('click', () => {
            quizBox.style.opacity = '0';
            setTimeout(() => {
                quizBox.style.display = 'none';
                loveScreen.style.display = 'block';
                
                // Elementləri dalğalı və daimi olaraq yaratmağa başlayırıq
                startInfiniteHeartCycle();
            }, 400);
            
            bgMusic.play().catch(e => console.log("Musiqi xətası:", e));
        });

        // Riyazi Ürək Koordinat Formulu
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return {
                x: 300 + x * 13,
                y: 270 - y * 13 
            };
        }

        // Daimi dövriyyəni təmin edən idarəetmə funksiyası
        function startInfiniteHeartCycle() {
            const totalPoints = 120; // Ürəyi təşkil edən nöqtə sayı
            
            // Hər nöqtə üçün elementi yaradırıq
            for (let i = 0; i < totalPoints; i++) {
                createCyclicElement(i, totalPoints);
            }
        }

        function createCyclicElement(index, totalPoints) {
            const angle = (index / totalPoints) * 2 * Math.PI;
            const targetPos = getHeartPoint(angle);

            const containerEl = document.createElement('div');
            containerEl.classList.add('floating-element', 'animate-item');

            // Kontent seçimi (%40 Mədinə, %30 Səni sevirəm, %20 Tülpan Şəkli, %10 Ürək Şəkli)
            const rand = Math.random();
            if (rand < 0.40) {
                containerEl.innerText = "Mədinə";
                containerEl.classList.add('floating-text-style');
            } else if (rand < 0.70) {
                containerEl.innerText = "Səni sevirəm";
                containerEl.classList.add('floating-text-style');
                containerEl.style.color = "#ff4d6d"; // Bir az rəng fərqliliyi
            } else if (rand < 0.90) {
                const img = document.createElement('img');
                img.src = realTulipImg;
                img.classList.add('floating-img-style');
                containerEl.appendChild(img);
            } else {
                const img = document.createElement('img');
                img.src = realHeartImg;
                img.classList.add('floating-img-style');
                img.style.width = "26px"; // Balans üçün
                containerEl.appendChild(img);
            }

            // Kənarlardan gəlmə koordinatları
            const side = Math.floor(Math.random() * 4);
            let startX, startY;
            const offset = 250;

            if (side === 0) { startX = Math.random() * window.innerWidth - (window.innerWidth / 2); startY = -offset; }
            else if (side === 1) { startX = window.innerWidth / 2 + offset; startY = Math.random() * window.innerHeight - (window.innerHeight / 2); }
            else if (side === 2) { startX = Math.random() * window.innerWidth - (window.innerWidth / 2); startY = window.innerHeight / 2 + offset; }
            else { startX = -window.innerWidth / 2 - offset; startY = Math.random() * window.innerHeight - (window.innerHeight / 2); }

            // Animasiya vaxtları (Mahnının tempinə uyğun axıcı və davamlı etmək üçün)
            const duration = 7 + Math.random() * 4; // 7-11 saniyə arası çəkir tam dövr
            const delay = Math.random() * 5; // İlk başda xaotik gəlmələri üçün fərqli gecikmələr

            containerEl.style.setProperty('--start-x', startX + 'px');
            containerEl.style.setProperty('--start-y', startY + 'px');
            containerEl.style.setProperty('--target-x', targetPos.x + 'px');
            containerEl.style.setProperty('--target-y', targetPos.y + 'px');
            
            containerEl.style.setProperty('--start-rot', (Math.random() * 360) + 'deg');
            containerEl.style.setProperty('--final-rot', (Math.random() * 20 - 10) + 'deg');
            containerEl.style.setProperty('--jitter-x', (Math.random() * 10 - 5) + 'px');
            containerEl.style.setProperty('--jitter-y', (Math.random() * 10 - 5) + 'px');
            
            containerEl.style.setProperty('--max-op', (0.8 + Math.random() * 0.2));
            containerEl.style.setProperty('--dur', duration + 's');
            containerEl.style.setProperty('--delay', delay + 's');

            heartContainer.appendChild(containerEl);

            // Element öz dövrünü (animasiyasını) bitirəndə onu tamamilə silirik 
            // və yerinə dərhal eyni nöqtə üçün təzəsini yaradırıq (Sonsuz Əvəzləmə Dövrü)
            setTimeout(() => {
                containerEl.remove();
                createCyclicElement(index, totalPoints);
            }, (duration + delay) * 1000);
        }
    </script>
</body>
</html>
